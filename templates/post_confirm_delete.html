{% extends 'base.html' %}

{% block title %}Confirmar Eliminación - Mi Blog{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row">
        <div class="col-lg-6 offset-lg-3">
            <div class="card border-danger shadow-lg">
                <div class="card-body text-center p-5">
                    <i class="fas fa-exclamation-triangle fa-3x text-danger mb-3"></i>
                    
                    <h2 class="card-title fw-bold mb-3">¿Estás seguro?</h2>
                    
                    <p class="card-text text-muted mb-3">
                        Estás a punto de eliminar el siguiente post:
                    </p>
                    
                    <div class="alert alert-light border mb-4">
                        <h5 class="fw-bold">{{ post.titulo }}</h5>
                        <p class="text-muted small mb-0">{{ post.subtitulo }}</p>
                    </div>
                    
                    <p class="card-text text-danger mb-4">
                        <strong>Esta acción no se puede deshacer.</strong>
                    </p>
                    
                    <form method="POST" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger btn-lg me-2">
                            <i class="fas fa-trash"></i> Sí, Eliminar
                        </button>
                    </form>
                    
                    <a href="{% url 'detail' post.id %}" class="btn btn-secondary btn-lg">
                        <i class="fas fa-arrow-left"></i> Cancelar
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
