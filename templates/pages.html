{% extends 'base.html' %}

{% block content %}

<h1>Páginas</h1>

{% if user.is_authenticated %}
    <a href="/pages/create/">Crear Post</a>
{% endif %}

{% if posts %}

    {% for post in posts %}

        <hr>

        <h2>{{ post.titulo }}</h2>

        <p>{{ post.subtitulo }}</p>

        <p>{{ post.fecha }}</p>

        <a href="/pages/{{ post.id }}/">Leer más</a>

    {% endfor %}

{% else %}

    <p>No hay páginas aún.</p>

{% endif %}

{% endblock %}
