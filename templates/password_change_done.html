{% extends 'base.html' %}

{% block title %}Contraseña Actualizada - Mi Blog{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row">
        <div class="col-md-6 offset-md-3">
            <div class="card border-success shadow-lg">
                <div class="card-body text-center p-5">
                    <i class="fas fa-check-circle fa-4x text-success mb-3"></i>
                    
                    <h2 class="card-title fw-bold text-success mb-3">
                        ¡Contraseña Actualizada!
                    </h2>
                    
                    <p class="card-text text-muted mb-4">
                        Tu contraseña ha sido cambiada correctamente. 🔐
                    </p>
                    
                    <p class="card-text text-muted mb-4">
                        Ya puedes usar tu nueva contraseña para iniciar sesión.
                    </p>
                    
                    <div class="d-grid gap-2">
                        <a href="{% url 'profile' %}" class="btn btn-success btn-lg">
                            <i class="fas fa-user"></i> Volver al Perfil
                        </a>
                        <a href="{% url 'home' %}" class="btn btn-outline-success btn-lg">
                            <i class="fas fa-home"></i> Ir al Inicio
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
