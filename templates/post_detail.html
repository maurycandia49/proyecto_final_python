{% extends 'base.html' %}

{% block content %}

<h1>{{ post.titulo }}</h1>

<h3>{{ post.subtitulo }}</h3>

<p>{{ post.contenido }}</p>

<p>{{ post.fecha }}</p>

{% if post.imagen %}
    <img src="{{ post.imagen.url }}" width="300">
{% endif %}

{% if user.is_authenticated %}
<a href="/pages/{{ post.id }}/edit/">Editar</a>

<a href="/pages/{{ post.id }}/delete/">Eliminar</a>

{% endif %}

{% endblock %}
